<!DOCTYPE html>
<html>
<!-- KEY:head -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="
        髙橋駿太のホームページです．Perimeter InstituteのPhD課程で理論物理学を研究しています．
    ">
    <meta name="keywords" content="高橋駿太, 髙橋駿太, タカハシシュンタ, Shunta Takahashi">
    <link rel="icon" href={{siteIcon}}>
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/main.js" defer></script>
    <title>Shunta Takahashi</title>
</head>
<!-- ENDKEY -->
<body data-tags="mathjax">
<main>
<h2>
    Papers/Talks
</h2>

    <div class="box" id="papers">
        <h3 class="box-title">論文</h3>
        <hr>
        <div class="box-text">
            <div class="research-links">
                <a class="research-link" href="{{sns.google-scholar.url}}" target="_blank" rel="noopener noreferrer">
                    <img src="{{sns.google-scholar.icon}}" alt="" class="research-link-icon">
                    <span>{{sns.google-scholar.name}}</span>
                    <span class="research-link-arrow" aria-hidden="true">↗</span>
                </a>
                <a class="research-link" href="{{sns.inspire-hep.url}}" target="_blank" rel="noopener noreferrer">
                    <img src="{{sns.inspire-hep.icon}}" alt="" class="research-link-icon">
                    <span>{{sns.inspire-hep.name}}</span>
                    <span class="research-link-arrow" aria-hidden="true">↗</span>
                </a>
            </div>
            <div class="author-order-note">
            hep-thの論文では、著者名は慣例でアルファベット順
            </div>
            <div data-publications><p role="status">論文一覧を読み込んでいます…</p></div>
        </div>
    </div>

    <div class="box" id="talks">
        <h3 class="box-title">講演</h3>
        <hr>
        <div class="box-text">
            <!-- 講演情報を記述 -->
            <div data-presentations><p role="status">発表一覧を読み込んでいます…</p></div>
        </div>
    </div>

</main>
</body>
</html>
