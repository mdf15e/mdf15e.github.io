<!DOCTYPE html>
<html>
<!-- KEY:head -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="
        Home page of Shunta Takahashi, a Ph.D. student in theoretical physics at Kyoto University.
    ">
    <meta name="keywords" content="Shunta Takahashi, 髙橋駿太, 高橋駿太, タカハシシュンタ">
    <link rel="icon" href={{siteIcon}}>
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/main.js" defer></script>
    <title>Shunta Takahashi</title>
</head>
<!-- ENDKEY -->
<body data-tags="mathjax">
<main>
<h2>
    Papers/Talks
</h2>

    <div class="box" id="papers">
        <h3 class="box-title">Publications</h3>
        <hr class="ruler">
        <div class="box-text">
            <!-- links: INSPIRE HEP, Google Scholar, arXiv -->
            <div class="research-links">
                <a class="research-link" href="{{sns.google-scholar.url}}" target="_blank" rel="noopener noreferrer">
                    <img src="{{sns.google-scholar.icon}}" alt="" class="research-link-icon">
                    <span>{{sns.google-scholar.name}}</span>
                    <span class="research-link-arrow" aria-hidden="true">↗</span>
                </a>
                <a class="research-link" href="{{sns.inspire-hep.url}}" target="_blank" rel="noopener noreferrer">
                    <img src="{{sns.inspire-hep.icon}}" alt="" class="research-link-icon">
                    <span>{{sns.inspire-hep.name}}</span>
                    <span class="research-link-arrow" aria-hidden="true">↗</span>
                </a>
            </div>
            <div class="author-order-note">
                The name of the authors are customarily listed in alphabetical order in hep-th paper.
            </div>
            <div data-publications><p role="status">Loading publications…</p></div>
        </div>
    </div>

    <div class="box" id="talks">
        <h3 class="box-title">Talks</h3>
        <hr class="ruler">
        <div class="box-text">
            <div data-presentations><p role="status">Loading presentations…</p></div>
        </div>
    </div>

</main>
</body>
</html>
